<div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0, 0, 0, 0.6);" (click)="onCancel()">
  
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg">
      
      <div class="modal-header bg-light">
        <div>
          <h5 class="modal-title fw-bold text-dark mb-0">Dodaj wycieczkę</h5>
          <small class="text-muted">{{ day }}</small>
        </div>
        <button type="button" class="btn-close" (click)="onCancel()"></button>
      </div>
      
      <div class="modal-body p-4">
        <form [formGroup]="tripForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label for="country" class="form-label fw-semibold small text-secondary">Kraj</label>
            <input id="country" type="text" class="form-control" formControlName="country" placeholder="np. Polska">
          </div>

          <div class="mb-3">
            <label for="city" class="form-label fw-semibold small text-secondary">Miasto</label>
            <input id="city" type="text" class="form-control" formControlName="city" placeholder="np. Gdynia" (blur)="fetchWeather()">
          </div>

          <div class="alert alert-info py-2 px-3 d-flex align-items-center mb-3" *ngIf="isLoadingWeather || currentWeather || weatherError">
            
            <div *ngIf="isLoadingWeather" class="text-info w-100 text-center small fw-bold">
              <div class="spinner-border spinner-border-sm me-2" role="status"></div> Pobieranie pogody...
            </div>
            
            <div *ngIf="weatherError" class="text-danger w-100 text-center small">
              ❌ Nie udało się znaleźć pogody.
            </div>
            
            <div *ngIf="currentWeather && !isLoadingWeather" class="d-flex align-items-center gap-3 w-100">
              <img [src]="currentWeather.icon" alt="Ikona" style="width: 45px; height: 45px;">
              <div>
                <div class="fw-bold text-dark mb-0">{{ currentWeather.cityName }}</div>
                <div class="small text-muted" style="line-height: 1;">{{ currentWeather.text }}</div>
              </div>
              <div class="ms-auto">
                <span class="badge bg-primary fs-6">{{ currentWeather.temperature }}°C</span>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <label for="cost" class="form-label fw-semibold small text-secondary">Koszt wycieczki</label>
            <div class="input-group">
              <input id="cost" type="number" class="form-control" formControlName="cost" placeholder="np. 1250">
              <span class="input-group-text">PLN</span>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-2">
            <button type="button" class="btn btn-light border" (click)="onCancel()">Anuluj</button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="tripForm.invalid">Zapisz</button>
          </div>

        </form>
      </div>
      
    </div>
  </div>
</div>
